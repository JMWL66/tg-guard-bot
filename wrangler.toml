# wrangler.toml — Cloudflare Workers 設定檔
# 文件：https://developers.cloudflare.com/workers/wrangler/configuration/

name = "tg-guard-bot-v2"
main = "src/index.js"
compatibility_date = "2025-01-01"

[[kv_namespaces]]
binding = "TG_GUARD_KV"
id = "548d83f594b94dedb9778dad7f4d8099"

[triggers]
crons = ["* * * * *", "0 0 * * *"]

# 自定義域名：繞過被封的 workers.dev 子域，Telegram webhook 指向此處
[[routes]]
pattern = "tg.yomijmwl.ccwu.cc"
custom_domain = true
